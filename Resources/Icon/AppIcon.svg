<?xml version="1.0" encoding="UTF-8"?>
<!-- The canonical Fader mark: flat accent square + three vertical bars at
     different heights. Same glyph, same flat single color (#FF5A1F), as
     the website's nav/footer/demo mark — this file is the one source of
     truth every other icon (favicon, DMG icon, Dock/Finder icon, menu
     bar icon, in-app badge) is generated or drawn from. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#FF5A1F"/>
    <!-- Bars scaled 42x from the 16-unit web glyph (M3 12V4 M8 13V3 M13 10V6),
         centered with equal margin on all sides. -->
    <g stroke="#FFFFFF" stroke-width="84" stroke-linecap="round" fill="none">
      <path d="M302 680V344"/>
      <path d="M512 722V302"/>
      <path d="M722 596V428"/>
    </g>
  </g>
</svg>
